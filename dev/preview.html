<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt craft · UI preview</title>
<style>
:root {
  --dsw-alias-bg-base:#ffffff; --dsw-alias-bg-layer-1:#ffffff; --dsw-alias-bg-layer-2:#f4f5f8;
  --dsw-alias-bg-overlay:#ffffff; --dsw-alias-border-l1:#e5e7ee; --dsw-alias-border-l2:#d7dbe5;
  --dsw-alias-label-primary:#222632; --dsw-alias-label-secondary:#6c7283;
  --dsw-alias-brand-primary:#4d6bfe; --dsw-alias-state-success-primary:#18825b;
  --dsw-alias-state-error-primary:#c53a4c; --dsw-alias-state-warn-primary:#946216; --dsw-alias-state-idle-primary:#7b8292;
  color-scheme:light;
}
[data-theme="dark"] {
  --dsw-alias-bg-base:#14161b; --dsw-alias-bg-layer-1:#1e2128; --dsw-alias-bg-layer-2:#292d36;
  --dsw-alias-bg-overlay:#1e2128; --dsw-alias-border-l1:#343944; --dsw-alias-border-l2:#464d5b;
  --dsw-alias-label-primary:#eef0f6; --dsw-alias-label-secondary:#a0a8bb;
  --dsw-alias-brand-primary:#91a3ff; --dsw-alias-state-success-primary:#76d2ad;
  --dsw-alias-state-error-primary:#ff9ca6; --dsw-alias-state-warn-primary:#e4bb71; --dsw-alias-state-idle-primary:#9aa3b7;
  color-scheme:dark;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--dsw-alias-bg-base); color:var(--dsw-alias-label-primary); font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
button, input, select, textarea { font:inherit; }
.lab-bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; min-height:58px; padding:10px 24px; border-bottom:1px solid var(--dsw-alias-border-l1); background:var(--dsw-alias-bg-layer-1); }
.lab-brand { font-weight:650; margin-right:auto; letter-spacing:.03em; }
.lab-badge { margin-left:8px; font-size:10px; padding:3px 6px; border-radius:5px; color:var(--dsw-alias-brand-primary); background:var(--dsw-alias-bg-layer-2); }
.lab-bar button,.lab-bar select { min-height:30px; max-width:100%; padding:3px 9px; border:1px solid var(--dsw-alias-border-l1); border-radius:7px; background:var(--dsw-alias-bg-base); color:inherit; font-size:12px; }
.lab-shell { display:grid; grid-template-columns:220px minmax(0,1fr); min-height:calc(100vh - 58px); }
.lab-sidebar { padding:28px 18px; border-right:1px solid var(--dsw-alias-border-l1); background:var(--dsw-alias-bg-layer-2); }
.lab-sidebar strong { display:block; margin:0 10px 26px; font-size:17px; }
.lab-nav { padding:9px 12px; margin-bottom:6px; color:var(--dsw-alias-label-secondary); border-radius:8px; font-size:13px; }
.lab-nav.active { background:var(--dsw-alias-bg-layer-1); color:var(--dsw-alias-label-primary); }
.lab-content { padding:32px; min-width:0; }
.lab-chat { max-width:860px; margin:0 auto; padding-bottom:235px; }
.lab-chat-head { font-size:12px; color:var(--dsw-alias-label-secondary); margin-bottom:36px; }
.lab-user { margin-left:auto; max-width:70%; width:fit-content; padding:12px 18px; background:var(--dsw-alias-bg-layer-2); border-radius:16px 16px 4px 16px; }
.lab-assistant { margin-top:30px; max-width:600px; color:var(--dsw-alias-label-secondary); }
.lab-assistant strong { display:block; color:var(--dsw-alias-label-primary); font-size:16px; margin-bottom:12px; }
.lab-composer-dock { position:fixed; bottom:22px; left:calc(220px + (100% - 220px)/2); transform:translateX(-50%); width:min(860px,calc(100% - 284px)); }
.lab-composer { position:relative; padding:14px 16px 12px; border:1px solid var(--dsw-alias-border-l2); border-radius:18px; background:var(--dsw-alias-bg-layer-1); box-shadow:0 8px 28px color-mix(in srgb,var(--dsw-alias-label-primary) 5%,transparent); }
.lab-draft { display:block; width:100%; height:80px; padding:0; border:0; outline:0; resize:vertical; color:inherit; background:transparent; font-size:14px; line-height:1.65; }
.lab-tools { display:flex; align-items:center; gap:8px; margin-top:12px; }
.lab-tools button { cursor:pointer; }
.lab-tool { border:1px solid var(--dsw-alias-border-l1); border-radius:7px; background:var(--dsw-alias-bg-layer-2); color:var(--dsw-alias-label-secondary); padding:3px 8px; font-size:12px; }
.lab-spacer { flex:1; }
.lab-send { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; background:var(--dsw-alias-brand-primary); color:var(--dsw-alias-bg-base); font-size:17px; }
.lab-footnote { text-align:center; font-size:11px; color:var(--dsw-alias-label-secondary); margin-top:7px; }
.lab-settings { margin:0 auto; max-width:720px; padding:4px 0 40px; }
.lab-chip { display:inline-block; padding:2px 8px; border:1px solid var(--dsw-alias-border-l1); background:var(--dsw-alias-bg-layer-2); border-radius:6px; font-size:12px; margin-bottom:8px; }
.lab-hero .lab-composer-dock { bottom:auto; top:32%; }
.lab-hero .lab-chat { opacity:.35; }
@media(max-width:980px) { .lab-shell { grid-template-columns:minmax(0,1fr); } .lab-sidebar { display:none; } .lab-composer-dock { left:50%; width:calc(100% - 32px); } }
@media(max-width:480px) { .lab-bar { padding:10px 14px; gap:6px; } .lab-brand { flex-basis:100%; } .lab-content { padding:20px 16px; } .lab-composer-dock { width:calc(100% - 24px); bottom:12px; } .lab-user { max-width:90%; } }
</style>
</head><body><div id="root"></div><script type="module" src="/preview.js"></script></body>
</html>
